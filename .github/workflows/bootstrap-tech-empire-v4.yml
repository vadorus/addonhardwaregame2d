name: Bootstrap Tech Empire source v4

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/bootstrap-tech-empire-v4.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source bundle
        shell: bash
        run: |
          cat .bootstrap/parts/part*.b64 | base64 -d > /tmp/tech-empire-source.tar.gz
          tar -xzf /tmp/tech-empire-source.tar.gz -C .

      - name: Apply Godot 4.7 fixes and smoke runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main.gd')
          s = p.read_text(encoding='utf-8')
          s = s.replace('var m:=p.metrics; var metric_lines:=[]', 'var m: Dictionary = p.get("metrics", {}); var metric_lines: Array = []')
          p.write_text(s, encoding='utf-8')
          PY
          cat > tests/smoke_test.gd <<'EOF'
          extends Node

          func _ready() -> void:
            print("[CI] Tech Empire smoke test starting")
            SimulationManager.reset_all("CI Test", "CPU")
            if not CompanyManager.created:
              _fail("Company was not created")
              return
            if Economy.money != 500_000:
              _fail("Unexpected starting money: %s" % Economy.money)
              return
            var started: bool = ResearchManager.start_project("CI CPU", "CPU", "MAINSTREAM", "INTERNAL", "PERFORMANCE", 42_000)
            if not started:
              _fail("Could not start R&D project")
              return
            var report: Dictionary = SimulationManager.process_month_end()
            if report.is_empty():
              _fail("Monthly report is empty")
              return
            if int(report.get("money", -1)) != Economy.money:
              _fail("Monthly report balance does not match economy")
              return
            print("[CI] Smoke test passed")
            get_tree().quit(0)

          func _fail(message: String) -> void:
            push_error("[CI] " + message)
            get_tree().quit(1)
          EOF
          cat > tests/smoke_test.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://tests/smoke_test.gd" id="1_smoke"]

          [node name="SmokeTest" type="Node"]
          script = ExtResource("1_smoke")
          EOF

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Import and parse project
        shell: bash
        run: |
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log; then exit 1; fi

      - name: Boot main scene
        shell: bash
        run: |
          godot --headless --path . --quit-after 2 2>&1 | tee /tmp/godot-boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-boot.log; then exit 1; fi

      - name: Run smoke test
        shell: bash
        run: |
          godot --headless --path . res://tests/smoke_test.tscn 2>&1 | tee /tmp/godot-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR: \[CI\]' /tmp/godot-smoke.log; then exit 1; fi

      - name: Commit validated source
        shell: bash
        run: |
          rm -f Tech-Empire-Prototype-V0.2.zip
          rm -rf .bootstrap
          rm -f .github/workflows/godot-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: import validated Tech Empire V0.2.2 Godot source'
          git push origin HEAD:master
