name: Android APK Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      signing:
        description: Android signing mode (stable is manual only)
        type: choice
        options: [debug, stable]
        default: debug
        required: true

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_APK_PATH: build/android/TechEmpire-v0.8-debug.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Prepare Android SDK and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not available on this runner."
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit
          SETTINGS="$(find "$HOME/.config/godot" -maxdepth 1 -name 'editor_settings-*.tres' | head -n 1)"
          if [ -z "$SETTINGS" ] || [ ! -f "$SETTINGS" ]; then
            echo "Godot editor settings file not found"
            exit 1
          fi
          python3 - "$SETTINGS" <<'PY'
          import os, re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          values = {
              "export/android/android_sdk_path": os.environ["ANDROID_SDK_ROOT"],
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
              "export/android/debug_keystore": str(Path.home() / ".android" / "debug.keystore"),
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }
          for key, value in values.items():
              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              line = f'{key} = "{escaped}"'
              pattern = rf'(?m)^{re.escape(key)}\s*=.*$'
              if re.search(pattern, text):
                  text = re.sub(pattern, line, text)
              else:
                  text += "\n" + line
          path.write_text(text)
          PY
          grep -E 'export/android/(android_sdk_path|java_sdk_path|debug_keystore)' "$SETTINGS"

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -E 'ERROR:|SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi

      - name: Export Android debug APK
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.signing == 'stable') }}
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.ci-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cp "$HOME/.android/debug.keystore" "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          mkdir -p build/android
          set -o pipefail
          godot --headless --path . --export-debug "Android APK" build/android/TechEmpire-v0.8-debug.apk 2>&1 | tee /tmp/android-export.log
          if grep -E 'ERROR:|SCRIPT ERROR|Parse Error|Failed to load script' /tmp/android-export.log; then exit 1; fi
          test -s build/android/TechEmpire-v0.8-debug.apk

      - name: Export Android stable APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing == 'stable' }}
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.TECH_EMPIRE_ANDROID_KEYSTORE_B64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.TECH_EMPIRE_ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.TECH_EMPIRE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_B64" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "Stable signing requires all three configured signing secrets."
            exit 1
          fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/techempire-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$KEYSTORE"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$RELEASE_KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$RELEASE_KEY_PASSWORD"
          mkdir -p build/android
          godot --headless --path . --export-release "Android APK" build/android/TechEmpire-stable.apk 2>&1 | tee /tmp/android-export.log
          if grep -E 'ERROR:|SCRIPT ERROR|Parse Error|Failed to load script' /tmp/android-export.log; then exit 1; fi
          test -s build/android/TechEmpire-stable.apk
          echo "ANDROID_APK_PATH=build/android/TechEmpire-stable.apk" >> "$GITHUB_ENV"

      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail
          ls -lh build/android
          file "$ANDROID_APK_PATH"
          sha256sum "$ANDROID_APK_PATH" | tee build/android/SHA256SUMS.txt
          unzip -l "$ANDROID_APK_PATH" | grep -E 'AndroidManifest.xml|lib/arm64-v8a/libgodot_android.so'

      - name: Verify signing certificate and summarize APK
        shell: bash
        env:
          STABLE_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.signing == 'stable' }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.1"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$ANDROID_APK_PATH" > "$RUNNER_TEMP/android-certificates.txt"
          "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$ANDROID_APK_PATH" > "$RUNNER_TEMP/android-manifest.txt"
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          certs = (root / 'android-certificates.txt').read_text()
          manifest = (root / 'android-manifest.txt').read_text()
          fingerprints = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]{64})$', certs, re.M)
          subjects = re.findall(r'^Signer #\d+ certificate DN: (.+)$', certs, re.M)
          if len(fingerprints) != 1 or len(subjects) != 1:
              raise SystemExit('Exactly one APK signer is required.')
          fingerprint = fingerprints[0].lower()
          expected = '1ab3db61a2491395fccc6c92e5bd14e0443f18e34b3de7b072b83cc8908acadd'
          if os.environ['STABLE_SIGNING'] == 'true' and fingerprint != expected:
              raise SystemExit('Stable signing certificate does not match the pinned SHA256.')
          def field(pattern):
              match = re.search(pattern, manifest, re.M)
              if not match:
                  raise SystemExit('Required APK manifest metadata is missing.')
              return match.group(1)
          package = field(r'^\s*A: package="([^"]+)"')
          version_name = field(r'^\s*A: [^\n]*:versionName\([^)]*\)="([^"]+)"')
          version_code = field(r'^\s*A: [^\n]*:versionCode\([^)]*\)=(\d+)\s*$')
          mode = 'stable (pinned certificate verified)' if os.environ['STABLE_SIGNING'] == 'true' else 'debug'
          lines = ['## Android APK', f'- Signing: {mode}', f'- Source SHA: {os.environ["GITHUB_SHA"]}',
                   f'- Package: {package}', f'- Version name: {version_name}', f'- Version code: {version_code}',
                   f'- Certificate DN: {subjects[0]}', f'- Certificate SHA256: {fingerprint}']
          summary = '\n'.join(lines) + '\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print(summary, end='')
          PY

      - name: Remove temporary release keystore
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.signing == 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/techempire-release.jks"
          test ! -e "$RUNNER_TEMP/techempire-release.jks"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.signing == 'stable' && 'TechEmpire-Android-stable' || 'TechEmpire-Android-v0.8-debug' }}
          path: |
            ${{ env.ANDROID_APK_PATH }}
            build/android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

