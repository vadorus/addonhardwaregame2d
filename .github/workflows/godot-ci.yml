name: Godot CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Godot version
        run: godot --version

      - name: Validate Agents API pilot scripts
        shell: bash
        run: |
          bash -n tools/agents/collect_patch.sh
          node --check tools/agents/run_agent.mjs

      - name: Import and parse
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi

      - name: Boot main scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 2 2>&1 | tee /tmp/boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/boot.log; then exit 1; fi

      - name: Smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://tests/smoke_test.tscn 2>&1 | tee /tmp/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR: \[CI\]' /tmp/smoke.log; then exit 1; fi

