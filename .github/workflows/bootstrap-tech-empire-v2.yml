name: Bootstrap Tech Empire source v2

on:
  push:
    branches: [master]
    paths:
      - '.bootstrap/parts/**'
      - '.github/workflows/bootstrap-tech-empire-v2.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source bundle
        shell: bash
        run: |
          cat .bootstrap/parts/part*.b64 | base64 -d > /tmp/tech-empire-source.tar.gz
          tar -xzf /tmp/tech-empire-source.tar.gz -C .

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Import and parse project
        run: godot --headless --path . --import

      - name: Boot main scene
        run: godot --headless --path . --quit-after 2

      - name: Run smoke test
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Prepare source commit
        shell: bash
        run: |
          rm -f Tech-Empire-Prototype-V0.2.zip
          rm -rf .bootstrap

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import validated Tech Empire V0.2.2 Godot source'
          git push origin HEAD:master
