<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e9dfcf"/><stop offset="1" stop-color="#cbbda9"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7e756b"/><stop offset="1" stop-color="#59534f"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a5d36"/><stop offset=".5" stop-color="#b17a48"/><stop offset="1" stop-color="#6f472c"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#173450"/><stop offset="1" stop-color="#0b1726"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#111927" flood-opacity=".35"/></filter>
  <filter id="warm"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ffcf7d" flood-opacity=".45"/></filter>
</defs>
<rect width="1280" height="520" fill="#0f1826"/>
